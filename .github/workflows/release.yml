name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (e.g. 1.0.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    # macOS runner so the darwin binaries can be re-signed with codesign
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Resolve version
        id: v
        run: echo "version=${{ inputs.version || github.ref_name }}" | sed 's/version=v/version=/' >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1 || gh release create "v${{ steps.v.outputs.version }}" --title "v${{ steps.v.outputs.version }}" --generate-notes
      - name: Build and upload binaries
        working-directory: packages/opencode
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_VERSION: ${{ steps.v.outputs.version }}
          OPENCODE_CHANNEL: latest
          OPENCODE_RELEASE: "1"
        run: bun run script/build.ts
